plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.yumiacalls'
version = '1.0.0'

android {
  namespace "expo.modules.yumiacalls"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // Mêmes versions qu'expo-notifications 57 (une seule copie dans l'app).
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
  implementation 'androidx.core:core:1.17.0'
}
