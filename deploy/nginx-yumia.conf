# ============================================================================
# YUMIA — configuration nginx du droplet `medoutradingbot` (207.154.198.77)
#
# Copie fidèle de /etc/nginx/sites-enabled/yumia tel qu'il tourne réellement,
# relevée le 12 septembre 2026. Ce fichier n'est PAS lu automatiquement : il
# existe pour que le dépôt décrive la machine, et pour pouvoir la reconstruire
# si le droplet est perdu. Quand tu modifies la config sur le serveur, reporte
# la modification ici — le fichier qu'il remplace (`deploy/Caddyfile`) décrivait
# une installation Caddy sur `yumia.app` qui n'a jamais existé sur cette
# machine, et il a fait perdre du temps.
#
# Trois hôtes, un seul certificat :
#   yumia.eu, www.yumia.eu  → site vitrine + pages légales (fichiers statiques)
#   api.yumia.eu            → l'API NestJS, dans Docker sur le port 4000
#
# DNS (chez OVH), les trois pointant vers 207.154.198.77 :
#   A  yumia.eu  /  A  www.yumia.eu  /  A  api.yumia.eu
#
# Installation sur une machine neuve :
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp /root/yumia/deploy/nginx-yumia.conf /etc/nginx/sites-available/yumia
#   sudo ln -s /etc/nginx/sites-available/yumia /etc/nginx/sites-enabled/yumia
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo certbot --nginx -d yumia.eu -d www.yumia.eu -d api.yumia.eu
#   sudo nginx -t && sudo systemctl reload nginx
#
# Publier le site (pages légales incluses) — la source est `website/`, jamais
# une autre copie ; vérifier le contenu avant d'écraser :
#   diff /var/www/yumia/terms.html /root/yumia/website/terms.html
#   sudo cp /root/yumia/website/* /var/www/yumia/
# Aucun rechargement nginx nécessaire : ce sont des fichiers statiques.
#
# Renouvellement TLS : automatique (timer systemd de certbot).
# ============================================================================

# --- HTTP : tout part en HTTPS ----------------------------------------------
server {
    listen 80;
    server_name yumia.eu www.yumia.eu api.yumia.eu;
    return 301 https://$host$request_uri;
}

# --- Site vitrine + pages légales -------------------------------------------
# `try_files` avec `$uri.html` donne les URL sans extension attendues par les
# boutiques d'applications : /privacy, /terms, /delete-account, /support.
server {
    listen 443 ssl;
    server_name yumia.eu www.yumia.eu;

    ssl_certificate /etc/letsencrypt/live/yumia.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yumia.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/yumia;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# --- API : proxy vers le conteneur NestJS -----------------------------------
server {
    listen 443 ssl;
    server_name api.yumia.eu;

    # 60 Mo : l'upload des vidéos (reels, stories) passe par là.
    client_max_body_size 60M;
    # 300 s : la génération d'un itinéraire par l'IA dépasse le défaut de 60 s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    ssl_certificate /etc/letsencrypt/live/yumia.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yumia.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
