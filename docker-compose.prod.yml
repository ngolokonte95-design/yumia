# Production compose — utiliser avec un fichier .env.prod ou des secrets Docker.
# Lancement : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yumia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${POSTGRES_DB:-yumia}
    volumes:
      - yumia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    command: redis-server --requirepass ${REDIS_PASSWORD:?missing}
    volumes:
      - yumia_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '$$REDIS_PASSWORD', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/yumia/api:latest}
    restart: unless-stopped
    # Rotation des logs : sans elle, json-file grossit sans limite sur le disque
    # du droplet (partagé avec d'autres projets).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Lu par configuration.ts (API_PORT) ; le conteneur écoute toujours 4000.
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-yumia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yumia}?schema=public&connection_limit=10&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?missing}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?missing}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?missing}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      APPLE_AUDIENCES: ${APPLE_AUDIENCES:-com.yumia.app}
      # Couverture mondiale des lieux : clé Google Places API (New). Vide = off.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      PLACES_PROVIDER: ${PLACES_PROVIDER:-}
      PLACES_HYDRATE: ${PLACES_HYDRATE:-true}
      # URL publique de l'API (pour les liens du proxy photo). Ex : http://207.154.198.77:4000
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@yumia.app}
      # disk par défaut tant qu'aucun credential S3 n'existe ; l'URL publique
      # retombe sur API_PUBLIC_BASE_URL (voir configuration.ts).
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-disk}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Nom lu par configuration.ts (S3_BUCKET n'était lu nulle part).
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-yumia-uploads}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      # Clé secrète RevenueCat (API REST v1) : vérification serveur des achats.
      REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yumia.app}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Affiliation — Partner ID depuis le tableau de bord de chaque programme
      GETYOURGUIDE_PARTNER_ID: ${GETYOURGUIDE_PARTNER_ID:-}
      # Clé de la GetYourGuide Partner API (X-ACCESS-TOKEN) — distincte du
      # partner_id ci-dessus, utilisée par GetYourGuideProvider.verifyListing().
      GETYOURGUIDE_API_KEY: ${GETYOURGUIDE_API_KEY:-}
      VIATOR_PARTNER_ID: ${VIATOR_PARTNER_ID:-}
      # Clé API de production (exp-api-key, "Accès de base") — distincte du pid
      # ci-dessus, utilisée par ViatorProvider.verifyListing() pour confirmer
      # qu'un lieu a vraiment une fiche Viator avant de l'afficher dans Bons Plans.
      VIATOR_API_KEY: ${VIATOR_API_KEY:-}
      BOOKING_AFFILIATE_ID: ${BOOKING_AFFILIATE_ID:-}
      # Discover Cars (location de voiture) — identifiant d'affilié « yumia »,
      # public (il figure dans chaque lien). Vide = onglet Location masqué.
      DISCOVERCARS_AFFILIATE_ID: ${DISCOVERCARS_AFFILIATE_ID:-}
      # Secret partagé du webhook de conversion (en-tête x-yumia-webhook-secret).
      # Vide en production = webhook fermé (toutes les requêtes refusées).
      AFFILIATE_WEBHOOK_SECRET: ${AFFILIATE_WEBHOOK_SECRET:-}

      # Boutique — dropshipping AliExpress. APP_KEY/APP_SECRET viennent de la
      # console AliExpress Open Platform ; le jeton OAuth, lui, est stocké en
      # base (table AliExpressToken) après le consentement admin, pas ici.
      ALIEXPRESS_APP_KEY: ${ALIEXPRESS_APP_KEY:-}
      ALIEXPRESS_APP_SECRET: ${ALIEXPRESS_APP_SECRET:-}
      ALIEXPRESS_CALLBACK_URL: ${ALIEXPRESS_CALLBACK_URL:-}
      # Compte AliExpress partagé avec SPORTIA (une seule app Drop Shipping par
      # compte, et un second compte à la même identité risque la suspension).
      # SPORTIA détient et renouvelle le jeton ; YUMIA le lit ici et le met en
      # cache — sans ces variables, YUMIA repasse en mode autonome (elle
      # renouvelle elle-même), à utiliser le jour où elle aura son propre compte.
      ALIEXPRESS_TOKEN_SOURCE_URL: ${ALIEXPRESS_TOKEN_SOURCE_URL:-}
      ALIEXPRESS_TOKEN_SOURCE_SECRET: ${ALIEXPRESS_TOKEN_SOURCE_SECRET:-}
      # Boutique — encaissement Stripe (biens physiques : l'achat intégré
      # Apple/Google est interdit pour ça, cf. App Store 3.1.5(a)).
      # STRIPE_WEBHOOK_SECRET est indispensable : sans lui, aucune commande ne
      # peut être confirmée (la signature du webhook n'est pas vérifiable).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Base des URL de retour après paiement Stripe.
      SHOP_RETURN_URL_BASE: ${SHOP_RETURN_URL_BASE:-}
    volumes:
      - yumia_uploads:/app/apps/api/uploads
    ports:
      # Local uniquement : nginx (sur l'hôte) est la seule porte d'entrée. Publiée
      # sur 0.0.0.0, l'API était joignable en direct sur :4000 — Docker passe
      # outre ufw — avec un X-Forwarded-For choisi par le client, ce qui
      # annulait toutes les limites de débit (connexion, codes, IA).
      - '127.0.0.1:${API_PORT:-4000}:4000'
    # Liveness (et non readiness) : le conteneur n'est marqué unhealthy/redémarré
    # que si le PROCESS ne répond plus. Une panne transitoire de Postgres/Redis/ES
    # ne doit pas tuer l'API (qui a un fallback gracieux). La readiness (/api/health,
    # qui ping les dépendances) est réservée au routage load-balancer.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health/live || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  yumia_pgdata:
  yumia_redis:
  yumia_uploads:
